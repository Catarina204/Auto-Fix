<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AutoFix - Clientes</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f3f4f6;
            color: #333;
        }

        header {
            background-color: #ffffff;
            border-bottom: 1px solid #ddd;

            padding: 15px 30px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #dc2626;
        }

        .menu {
            display: flex;
            gap: 10px;
        }

        .menu a {
            text-decoration: none;

            color: #333;

            padding: 8px 12px;

            border-radius: 5px;

            font-size: 14px;
        }

        .menu a:hover {
            background-color: #f3f4f6;
        }

        .btn-sair {
            color: #dc2626 !important;
        }

        main {
            padding: 30px;
        }

        .titulo {
            margin-bottom: 25px;
        }

        .titulo h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .titulo p {
            color: #777;
        }

        .formulario {
            background-color: white;

            padding: 25px;

            border: 1px solid #ddd;
            border-radius: 8px;

            max-width: 1000px;

            margin-bottom: 25px;
        }

        .formulario h2 {
            font-size: 18px;
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 6px;

            color: #333;

            font-size: 14px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;

            padding: 11px;

            border: 1px solid #ccc;
            border-radius: 5px;

            font-size: 14px;

            outline: none;
        }

        .form-group input:focus {
            border-color: #dc2626;
        }

        .campo-completo {
            grid-column: 1 / 3;
        }

        .botoes {
            margin-top: 20px;

            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 16px;

            border: none;
            border-radius: 5px;

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;
        }

        .btn-salvar {
            background-color: #dc2626;
            color: white;
        }

        .btn-salvar:hover {
            background-color: #b91c1c;
        }

        .btn-cancelar {
            background-color: #e5e7eb;
            color: #333;

            display: none;
        }

        .btn-cancelar:hover {
            background-color: #d1d5db;
        }

        .mensagem {
            display: none;

            max-width: 1000px;

            margin-bottom: 20px;

            padding: 10px;

            border-radius: 5px;

            font-size: 14px;
        }

        .mensagem-sucesso {
            display: block;

            background-color: #dcfce7;
            color: #166534;

            border: 1px solid #86efac;
        }

        .mensagem-erro {
            display: block;

            background-color: #fee2e2;
            color: #b91c1c;

            border: 1px solid #fca5a5;
        }

        .lista {
            background-color: white;

            padding: 25px;

            border: 1px solid #ddd;
            border-radius: 8px;

            max-width: 1200px;
        }

        .lista-header {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 20px;

            margin-bottom: 20px;
        }

        .lista-header h2 {
            font-size: 18px;
        }

        .busca {
            width: 300px;

            padding: 10px;

            border: 1px solid #ccc;
            border-radius: 5px;

            font-size: 14px;

            outline: none;
        }

        .busca:focus {
            border-color: #dc2626;
        }

        .tabela {
            width: 100%;

            border-collapse: collapse;

            font-size: 14px;
        }

        .tabela th {
            background-color: #f9fafb;

            text-align: left;

            padding: 12px;

            border-bottom: 1px solid #ddd;
        }

        .tabela td {
            padding: 12px;

            border-bottom: 1px solid #eee;
        }

        .tabela tr:hover {
            background-color: #fafafa;
        }

        .acoes {
            display: flex;
            gap: 6px;
        }

        .btn-editar {
            background-color: #2563eb;
            color: white;

            border: none;
            border-radius: 4px;

            padding: 7px 10px;

            cursor: pointer;
        }

        .btn-editar:hover {
            background-color: #1d4ed8;
        }

        .btn-excluir {
            background-color: #dc2626;
            color: white;

            border: none;
            border-radius: 4px;

            padding: 7px 10px;

            cursor: pointer;
        }

        .btn-excluir:hover {
            background-color: #b91c1c;
        }

        .nenhum-cliente {
            text-align: center;

            color: #777;

            padding: 25px;
        }

        @media (max-width: 800px) {

            header {
                flex-direction: column;
                gap: 15px;
            }

            .menu {
                flex-wrap: wrap;
                justify-content: center;
            }

            main {
                padding: 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .campo-completo {
                grid-column: auto;
            }

            .lista-header {
                flex-direction: column;
                align-items: stretch;
            }

            .busca {
                width: 100%;
            }

        }

    </style>
</head>

<body>

    <header>

        <div class="logo">
            AutoFix
        </div>

        <nav class="menu">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="clientes.html">
                Clientes
            </a>

            <a href="veiculos.html">
                Veículos
            </a>

            <a href="ordens.html">
                Ordens de Serviço
            </a>

            <a href="index.html" class="btn-sair">
                Sair
            </a>

        </nav>

    </header>

    <main>

        <section class="titulo">

            <h1>
                Gestão de Clientes
            </h1>

            <p>
                Cadastre, edite, exclua e consulte os clientes da oficina.
            </p>

        </section>

        <div id="mensagem" class="mensagem"></div>

        <section class="formulario">

            <h2 id="tituloFormulario">
                Cadastrar Cliente
            </h2>

            <form id="clienteForm">

                <div class="form-grid">

                    <div class="form-group">

                        <label for="nome">
                            Nome
                        </label>

                        <input
                            type="text"
                            id="nome"
                            placeholder="Digite o nome do cliente"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label for="cpf">
                            CPF
                        </label>

                        <input
                            type="text"
                            id="cpf"
                            placeholder="Digite o CPF"
                            maxlength="14"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label for="telefone">
                            Telefone
                        </label>

                        <input
                            type="text"
                            id="telefone"
                            placeholder="Digite o telefone"
                        >

                    </div>

                    <div class="form-group">

                        <label for="email">
                            E-mail
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Digite o e-mail"
                        >

                    </div>

                    <div class="form-group campo-completo">

                        <label for="endereco">
                            Endereço
                        </label>

                        <input
                            type="text"
                            id="endereco"
                            placeholder="Digite o endereço"
                        >

                    </div>

                </div>

                <div class="botoes">

                    <button
                        type="submit"
                        class="btn btn-salvar"
                        id="btnSalvar"
                    >
                        Cadastrar Cliente
                    </button>

                    <button
                        type="button"
                        class="btn btn-cancelar"
                        id="btnCancelar"
                    >
                        Cancelar
                    </button>

                </div>

            </form>

        </section>

        <section class="lista">

            <div class="lista-header">

                <h2>
                    Clientes cadastrados
                </h2>

                <input
                    type="text"
                    id="busca"
                    class="busca"
                    placeholder="Buscar por nome ou CPF..."
                >

            </div>

            <div style="overflow-x: auto;">

                <table class="tabela">

                    <thead>

                        <tr>

                            <th>
                                ID
                            </th>

                            <th>
                                Nome
                            </th>

                            <th>
                                CPF
                            </th>

                            <th>
                                Telefone
                            </th>

                            <th>
                                E-mail
                            </th>

                            <th>
                                Endereço
                            </th>

                            <th>
                                Ações
                            </th>

                        </tr>

                    </thead>

                    <tbody id="tabelaClientes">

                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <script>

        const clienteForm =
            document.getElementById("clienteForm");

        const tabelaClientes =
            document.getElementById("tabelaClientes");

        const busca =
            document.getElementById("busca");

        const mensagem =
            document.getElementById("mensagem");

        const tituloFormulario =
            document.getElementById("tituloFormulario");

        const btnSalvar =
            document.getElementById("btnSalvar");

        const btnCancelar =
            document.getElementById("btnCancelar");

        let clientes =
            JSON.parse(
                localStorage.getItem("clientes")
            ) || [];

        let clienteEditando = null;


    

        clienteForm.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();

                const nome =
                    document.getElementById("nome")
                    .value
                    .trim();

                const cpf =
                    document.getElementById("cpf")
                    .value
                    .trim();

                const telefone =
                    document.getElementById("telefone")
                    .value
                    .trim();

                const email =
                    document.getElementById("email")
                    .value
                    .trim();

                const endereco =
                    document.getElementById("endereco")
                    .value
                    .trim();


                if (nome === "" || cpf === "") {

                    mostrarMensagem(
                        "Preencha o nome e o CPF.",
                        "erro"
                    );

                    return;
                }


                const cpfExiste =
                    clientes.some(function(cliente) {

                        return cliente.cpf === cpf &&
                               cliente.id !== clienteEditando;

                    });


                if (cpfExiste) {

                    mostrarMensagem(
                        "Este CPF já está cadastrado.",
                        "erro"
                    );

                    return;
                }


                if (clienteEditando !== null) {

                    const cliente =
                        clientes.find(function(cliente) {

                            return cliente.id === clienteEditando;

                        });


                    cliente.nome = nome;

                    cliente.cpf = cpf;

                    cliente.telefone = telefone;

                    cliente.email = email;

                    cliente.endereco = endereco;


                    mostrarMensagem(
                        "Cliente atualizado com sucesso.",
                        "sucesso"
                    );

                }

                else {

                    const novoCliente = {

                        id: clientes.length + 1,

                        nome: nome,

                        cpf: cpf,

                        telefone: telefone,

                        email: email,

                        endereco: endereco

                    };


                    clientes.push(novoCliente);


                    mostrarMensagem(
                        "Cliente cadastrado com sucesso.",
                        "sucesso"
                    );

                }


                localStorage.setItem(
                    "clientes",
                    JSON.stringify(clientes)
                );


                limparFormulario();

                listarClientes();

            }
        );



        function listarClientes() {

            const texto =
                busca.value
                .toLowerCase()
                .trim();


            tabelaClientes.innerHTML = "";


            const clientesFiltrados =
                clientes.filter(function(cliente) {

                    return (
                        cliente.nome
                            .toLowerCase()
                            .includes(texto)
                        ||
                        cliente.cpf
                            .includes(texto)
                    );

                });


            if (clientesFiltrados.length === 0) {

                tabelaClientes.innerHTML = `

                    <tr>

                        <td
                            colspan="7"
                            class="nenhum-cliente"
                        >
                            Nenhum cliente encontrado.
                        </td>

                    </tr>

                `;

                return;
            }


            clientesFiltrados.forEach(
                function(cliente) {

                    const linha =
                        document.createElement("tr");


                    linha.innerHTML = `

                        <td>
                            ${cliente.id}
                        </td>

                        <td>
                            ${cliente.nome}
                        </td>

                        <td>
                            ${cliente.cpf}
                        </td>

                        <td>
                            ${cliente.telefone || "-"}
                        </td>

                        <td>
                            ${cliente.email || "-"}
                        </td>

                        <td>
                            ${cliente.endereco || "-"}
                        </td>

                        <td>

                            <div class="acoes">

                                <button
                                    class="btn-editar"
                                    onclick="editarCliente(${cliente.id})"
                                >
                                    Editar
                                </button>

                                <button
                                    class="btn-excluir"
                                    onclick="excluirCliente(${cliente.id})"
                                >
                                    Excluir
                                </button>

                            </div>

                        </td>

                    `;


                    tabelaClientes.appendChild(linha);

                }
            );

        }


        function editarCliente(id) {

            const cliente =
                clientes.find(function(cliente) {

                    return cliente.id === id;

                });


            if (!cliente) {
                return;
            }


            document.getElementById("nome").value =
                cliente.nome;

            document.getElementById("cpf").value =
                cliente.cpf;

            document.getElementById("telefone").value =
                cliente.telefone;

            document.getElementById("email").value =
                cliente.email;

            document.getElementById("endereco").value =
                cliente.endereco;


            clienteEditando = id;


            tituloFormulario.textContent =
                "Editar Cliente";


            btnSalvar.textContent =
                "Salvar Alterações";


            btnCancelar.style.display =
                "inline-block";


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }


    

        function excluirCliente(id) {

            const cliente =
                clientes.find(function(cliente) {

                    return cliente.id === id;

                });


            if (!cliente) {
                return;
            }


            const confirmar =
                confirm(
                    "Deseja realmente excluir o cliente " +
                    cliente.nome +
                    "?"
                );


            if (!confirmar) {
                return;
            }


            clientes =
                clientes.filter(function(cliente) {

                    return cliente.id !== id;

                });


            localStorage.setItem(
                "clientes",
                JSON.stringify(clientes)
            );


            listarClientes();


            mostrarMensagem(
                "Cliente excluído com sucesso.",
                "sucesso"
            );

        }



        btnCancelar.addEventListener(
            "click",
            function() {

                limparFormulario();

            }
        );



        function limparFormulario() {

            clienteForm.reset();

            clienteEditando = null;

            tituloFormulario.textContent =
                "Cadastrar Cliente";

            btnSalvar.textContent =
                "Cadastrar Cliente";

            btnCancelar.style.display =
                "none";

        }



        busca.addEventListener(
            "input",
            function() {

                listarClientes();

            }
        );


        function mostrarMensagem(texto, tipo) {

            mensagem.textContent = texto;

            mensagem.className =
                "mensagem";


            if (tipo === "sucesso") {

                mensagem.classList.add(
                    "mensagem-sucesso"
                );

            }


            if (tipo === "erro") {

                mensagem.classList.add(
                    "mensagem-erro"
                );

            }


            setTimeout(
                function() {

                    mensagem.className =
                        "mensagem";

                    mensagem.textContent =
                        "";

                },
                3000
            );

        }


        listarClientes();

    </script>

</body>

</html>
